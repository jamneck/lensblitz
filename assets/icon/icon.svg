<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- LensBlitz app icon: a lens with a bolt through it, on the macOS icon grid
       (824 px rounded square centred on a 1024 px canvas). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232B55"/>
      <stop offset="1" stop-color="#0B0E1C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#4C6FFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4C6FFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0.15" y1="0.1" x2="0.85" y2="0.9">
      <stop offset="0" stop-color="#B9C6FF"/>
      <stop offset="1" stop-color="#3F64FF"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D5DEFF"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>
  <rect x="103" y="103" width="818" height="818" rx="183" fill="none" stroke="url(#edge)" stroke-width="6"/>
  <circle cx="512" cy="512" r="232" fill="#0B0E1C" fill-opacity="0.35"/>
  <circle cx="512" cy="512" r="232" fill="none" stroke="url(#ring)" stroke-width="52"/>
  <path d="M566 236 366 552h134l-42 236 200-316H524z" fill="#0E1226" stroke="#0E1226" stroke-width="44" stroke-linejoin="round"/>
  <path d="M566 236 366 552h134l-42 236 200-316H524z" fill="url(#bolt)"/>
</svg>
