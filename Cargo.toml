[package]
name = "lensblitz"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "An extremely fast, read-only Markdown viewer for macOS"
readme = "README.md"
keywords = ["markdown", "viewer", "macos", "egui"]
categories = ["text-processing", "visualization"]

[[bin]]
name = "lensblitz"
path = "src/main.rs"

[dependencies]
# glow (OpenGL) starts faster and uses less memory than wgpu for a 2D text app.
eframe = { version = "0.37", default-features = false, features = ["glow", "clipboard"] }
# Finds installed fonts (CJK, colour emoji, ...) for characters the bundled fonts lack.
egui_system_font_provider = "0.37"
pulldown-cmark = { version = "0.13", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
resvg = { version = "0.50", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
ureq = { version = "3", default-features = false, features = ["native-tls"] }
libc = "0.2"
winit = { version = "0.30", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSGeometry"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Quick optimised builds while iterating: `cargo build --profile fast`.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = false
